services:
  web:
    build: .
    ports:
      - "8000:80"
    environment:
      - APP_ENV=prod
      - DATABASE_URL=mysql://symfony:secret@database:3306/symfony
    depends_on:
      - database
    volumes:
      - ./var:/var/www/html/var

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: database
      PMA_USER: symfony
      PMA_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      - database

volumes:
  mysql_data:
